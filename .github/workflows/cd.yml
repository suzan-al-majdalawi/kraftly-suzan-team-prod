name: CI/CD

on:
  pull_request:

  push:
    branches: [main]

  # Gör att workflowen kan startas manuellt
  workflow_dispatch:

# PR-körningar får avbrytas om en ny commit pushas.
# Deploy på main får däremot inte avbrytas.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:

  verify:
    name: Test & bygg
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:run
      - run: npm run build


  publish:
    name: Image → GHCR
    runs-on: ubuntu-latest
    needs: verify

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Imagenamn
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Bygg imagen
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:main" .

      # På PR byggs imagen men pushas inte.
      - name: Visa image
        run: docker image ls "$IMAGE"

      - name: Logga in på GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pusha
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"


  # Tidigare hette jobbet "deploy".
  # Uppgiften använder namnet "deploy-staging".
  deploy-staging:
    name: Deploy → staging
    runs-on: ubuntu-latest
    needs: publish

    # Deploy körs bara efter merge/push till main.
    # På PR blir jobbet skipped.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:

      - name: Be Render köra exakt den här imagen
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

        run: |
          # Om RENDER_DEPLOY_HOOK saknas ska jobbet misslyckas.
          : "${HOOK:?RENDER_DEPLOY_HOOK saknas i miljön staging}"

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')

          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"

          echo
          echo "Render har tagit emot $IMAGE"


      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.STAGING_URL }}

        run: |
          : "${URL:?STAGING_URL saknas i miljön staging}"

          URL="${URL%/}"

          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)

            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi

            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu)} – väntar 10 s"

            sleep 10
          done

          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1


      # Kontrollerar att /api fungerar genom nginx/proxyn.
      - name: Röktest – går inloggningen genom proxyn?
        env:
          URL: ${{ vars.STAGING_URL }}

        run: |
          URL="${URL%/}"

          curl -fsS \
            -X POST \
            "$URL/api/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"a@b.se","password":"x"}'

          echo
          echo "✅ /api svarar via nginx med nyckeln från Render"
  
  deploy-production:
    name: Deploy → produktion
    runs-on: ubuntu-latest
    needs: deploy-staging # samma sha som just verifierades i staging – ingen ny build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Miljön "production" har required reviewers. Jobbet väntar tills någon godkänner
    # under Actions → körningen → Review deployments.
    environment:
      name: production
      url: ${{ vars.PROD_URL }}
    concurrency:
      group: deploy-production   # aldrig två produktionsdeployer samtidigt – den andra väntar på att den första blir klar
      cancel-in-progress: false
    steps:
      - name: Be Render köra exakt den här imagen i produktion
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          : "${HOOK:?RENDER_DEPLOY_HOOK saknas i miljön production}"

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          ENCODED=$(jq -rn --arg u "$IMAGE" '$u|@uri')

          curl -fsS -X POST "${HOOK}&imgURL=${ENCODED}"

          echo
          echo "Render har tagit emot $IMAGE (produktion)"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          
      - name: Vänta tills produktion kör den här committen
        if: steps.hook.outputs.deployed == 'true'
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::Variabeln PROD_URL saknas i miljön production – kan inte verifiera"
            exit 0
          fi
          URL="${URL%/}"
          for i in $(seq 1 30); do
            LIVE=$(curl -fsS "$URL/version.txt" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "✅ $URL kör $GITHUB_SHA"
              exit 0
            fi
            echo "Försök $i/30: produktion kör ${LIVE:-(inget svar ännu)} – väntar 10 s"
            sleep 10
          done
          echo "::error::Produktion kör fortfarande inte $GITHUB_SHA efter 5 minuter. Kolla Events/Logs i Render."
          exit 1

      - name: Röktest – svarar produktion utan Norge-kortet?
        if: steps.hook.outputs.deployed == 'true'
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          URL="${URL%/}"
          curl -fsS -X POST "$URL/api/login" -H 'Content-Type: application/json' -d '{"email":"a@b.se","password":"x"}'
          echo
          if curl -fsS "$URL/config.js" | grep -q "norway: false"; then
            echo "✅ /api svarar och FEATURE_NORWAY är av i produktion"
          else
            echo "::error::Norge-flaggan är PÅ i produktion – kontrollera FEATURE_NORWAY i Render"
            exit 1
          fi